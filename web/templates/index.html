<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantBot - 量化交易看板</title>
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#1e2130;--border:#2a2d3a;--text:#e4e6ef;--text2:#8b8fa3;--accent:#4f6ef7;--accent2:#6b85ff;--success:#34d399;--danger:#f87171;--warning:#fbbf24;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-size:18px}
.logo strong{color:var(--accent)}
.nav-tabs{display:flex;gap:4px;flex-wrap:wrap}
.nav-tab{background:none;border:none;color:var(--text2);padding:8px 14px;cursor:pointer;border-radius:var(--radius);font-size:13px}
.nav-tab:hover{background:var(--bg3)}
.nav-tab.active{background:var(--accent);color:white}
.main{padding:24px;max-width:1400px;margin:0 auto}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card h2 .badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.badge-crypto{background:#4f6ef720;color:#6b85ff}
.badge-astock{background:#f8717120;color:#f87171}
.badge-institution{background:#34d39920;color:#34d399}
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.form-group{flex:1;min-width:120px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.form-input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px}
.form-input:focus{outline:none;border-color:var(--accent)}
.btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:500}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg2)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:var(--danger);color:white}
.btn-success{background:var(--success);color:#000}
.btn-warning{background:var(--warning);color:#000}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px;text-align:center}
.stat-card .value{font-size:22px;font-weight:700}
.stat-card .label{font-size:11px;color:var(--text2);margin-top:4px}
.stat-card.positive .value{color:var(--success)}
.stat-card.negative .value{color:var(--danger)}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999}
.toast{padding:12px 20px;border-radius:var(--radius);margin-bottom:8px;font-size:13px;animation:fadeIn .3s}
.toast.info{background:var(--accent);color:white}
.toast.success{background:var(--success);color:#000}
.toast.error{background:var(--danger);color:white}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--text2);font-weight:600;font-size:11px;text-transform:uppercase}
.positive{color:var(--success)}.negative{color:var(--danger)}
select.form-input{appearance:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-buy{background:#34d39920;color:#34d399}
.tag-sell{background:#f8717120;color:#f87171}
.tag-active{background:#4f6ef720;color:#6b85ff}
.tag-pending{background:#fbbf2420;color:#fbbf24}
.tag-triggered{background:#34d39920;color:#34d399}
.empty-state{text-align:center;padding:40px;color:var(--text2);font-size:14px}
</style>
</head>
<body>
<header class="header">
  <div class="logo">📈 Quant<strong>Bot</strong></div>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-tab="backtest">回测</button>
    <button class="nav-tab" data-tab="live">实盘</button>
    <button class="nav-tab" data-tab="grid">网格</button>
    <button class="nav-tab" data-tab="dca">DCA</button>
    <button class="nav-tab" data-tab="smart">智能订单</button>
    <button class="nav-tab" data-tab="signal">信号</button>
    <button class="nav-tab" data-tab="copy">跟单</button>
    <button class="nav-tab" data-tab="factor">因子选股</button>
    <button class="nav-tab" data-tab="portfolio">组合</button>
    <button class="nav-tab" data-tab="strategy">策略</button>
    <button class="nav-tab" data-tab="settings">设置</button>
  </nav>
  <a href="/api/docs" target="_blank" class="btn btn-sm btn-ghost">API</a>
</header>

<main class="main">

  <!-- ========== 回测 ========== -->
  <section id="tab-backtest" class="tab-content active">
    <div class="card">
      <h2>策略回测</h2>
      <div class="form-row">
        <div class="form-group"><label>策略</label><select id="bt-strategy" class="form-input"></select></div>
        <div class="form-group"><label>交易对</label><input id="bt-symbol" class="form-input" value="BTC/USDT"></div>
        <div class="form-group"><label>周期</label><select id="bt-timeframe" class="form-input">
          <option value="1h">1H</option><option value="4h">4H</option><option value="1d">1D</option>
        </select></div>
        <div class="form-group"><label>天数</label><input id="bt-days" type="number" class="form-input" value="90"></div>
        <div class="form-group"><label>模拟数据</label><select id="bt-mock" class="form-input">
          <option value="true">是</option><option value="false" selected>否</option>
        </select></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="doBacktest()">运行回测</button>
        <button class="btn btn-ghost" onclick="doMonteCarlo()">蒙特卡洛</button>
        <button class="btn btn-ghost" onclick="doOptimize()">参数优化</button>
      </div>
    </div>
    <div id="bt-result" style="display:none">
      <div id="bt-stats" class="stat-grid"></div>
      <div class="card" style="margin-top:16px"><h2>收益曲线</h2><div id="chart-equity" style="height:300px"></div></div>
      <div class="grid-2" style="margin-top:16px">
        <div class="card"><h2>交易记录</h2><div id="bt-trades" style="max-height:300px;overflow:auto"></div></div>
        <div class="card"><h2>基准对比</h2><div id="bt-benchmark"></div></div>
      </div>
    </div>
    <div id="mc-result" class="card" style="display:none;margin-top:16px"><h2>蒙特卡洛模拟</h2><div id="mc-stats"></div></div>
    <div id="opt-result" class="card" style="display:none;margin-top:16px"><h2>参数优化</h2><div id="opt-table"></div></div>
  </section>

  <!-- ========== 实盘交易 ========== -->
  <section id="tab-live" class="tab-content">
    <div class="card">
      <h2>实盘引擎 <span class="badge badge-crypto">LIVE</span></h2>
      <div class="form-row">
        <div class="form-group"><label>策略</label><select id="live-strategy" class="form-input"></select></div>
        <div class="form-group"><label>交易对</label><input id="live-symbol" class="form-input" value="BTC/USDT"></div>
        <div class="form-group"><label>周期</label><select id="live-timeframe" class="form-input">
          <option value="1m">1M</option><option value="5m">5M</option><option value="15m">15M</option>
          <option value="1h" selected>1H</option><option value="4h">4H</option>
        </select></div>
        <div class="form-group"><label>WebSocket</label><select id="live-ws" class="form-input">
          <option value="false">REST</option><option value="true">WebSocket</option>
        </select></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-success" onclick="startLive()">启动实盘</button>
        <button class="btn btn-danger" onclick="stopLive()">停止实盘</button>
        <button class="btn btn-ghost" onclick="loadLiveStatus()">刷新状态</button>
      </div>
    </div>
    <div id="live-status" class="stat-grid"></div>
    <div class="grid-2" style="margin-top:16px">
      <div class="card"><h2>实盘网格</h2>
        <div class="form-row">
          <div class="form-group"><label>上界</label><input id="live-grid-upper" type="number" class="form-input" value="55000"></div>
          <div class="form-group"><label>下界</label><input id="live-grid-lower" type="number" class="form-input" value="45000"></div>
          <div class="form-group"><label>网格数</label><input id="live-grid-count" type="number" class="form-input" value="10"></div>
        </div>
        <button class="btn btn-primary" onclick="createLiveGrid()">创建网格</button>
        <div id="live-grids" style="margin-top:12px"></div>
      </div>
      <div class="card"><h2>实盘DCA</h2>
        <div class="form-row">
          <div class="form-group"><label>基础金额</label><input id="live-dca-base" type="number" class="form-input" value="100"></div>
          <div class="form-group"><label>加仓金额</label><input id="live-dca-safety" type="number" class="form-input" value="200"></div>
          <div class="form-group"><label>止盈%</label><input id="live-dca-tp" type="number" class="form-input" value="3"></div>
        </div>
        <button class="btn btn-primary" onclick="createLiveDCA()">创建DCA</button>
        <div id="live-dcas" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><h2>持仓</h2><div id="live-positions"></div></div>
  </section>

  <!-- ========== 网格交易 ========== -->
  <section id="tab-grid" class="tab-content">
    <div class="card">
      <h2>创建网格 <span class="badge badge-crypto">加密货币</span></h2>
      <div class="form-row">
        <div class="form-group"><label>交易对</label><input id="grid-symbol" class="form-input" value="BTC/USDT"></div>
        <div class="form-group"><label>网格类型</label><select id="grid-type" class="form-input">
          <option value="arithmetic">等差</option><option value="geometric">等比</option>
        </select></div>
        <div class="form-group"><label>上界价格</label><input id="grid-upper" type="number" class="form-input" value="50000"></div>
        <div class="form-group"><label>下界价格</label><input id="grid-lower" type="number" class="form-input" value="40000"></div>
        <div class="form-group"><label>网格数</label><input id="grid-count" type="number" class="form-input" value="10"></div>
        <div class="form-group"><label>投入 USDT</label><input id="grid-invest" type="number" class="form-input" value="10000"></div>
      </div>
      <button class="btn btn-primary" onclick="createGrid()">创建网格</button>
    </div>
    <div class="card"><h2>运行中的网格</h2><div id="grid-list"></div></div>
  </section>

  <!-- ========== DCA 定投 ========== -->
  <section id="tab-dca" class="tab-content">
    <div class="card">
      <h2>创建 DCA <span class="badge badge-crypto">加密货币</span></h2>
      <div class="form-row">
        <div class="form-group"><label>交易对</label><input id="dca-symbol" class="form-input" value="BTC/USDT"></div>
        <div class="form-group"><label>基础定投 USDT</label><input id="dca-base" type="number" class="form-input" value="100"></div>
        <div class="form-group"><label>加仓金额 USDT</label><input id="dca-safety" type="number" class="form-input" value="200"></div>
        <div class="form-group"><label>最大加仓次数</label><input id="dca-max-safety" type="number" class="form-input" value="5"></div>
        <div class="form-group"><label>加仓偏差 %</label><input id="dca-deviation" type="number" class="form-input" value="2"></div>
        <div class="form-group"><label>止盈 %</label><input id="dca-tp" type="number" class="form-input" value="3"></div>
      </div>
      <button class="btn btn-primary" onclick="createDCA()">创建 DCA</button>
    </div>
    <div class="card"><h2>运行中的 DCA</h2><div id="dca-list"></div></div>
  </section>

  <!-- ========== 智能订单 ========== -->
  <section id="tab-smart" class="tab-content">
    <div class="card">
      <h2>创建智能订单 <span class="badge badge-crypto">加密货币</span></h2>
      <div class="form-row">
        <div class="form-group"><label>交易对</label><input id="sm-symbol" class="form-input" value="BTC/USDT"></div>
        <div class="form-group"><label>方向</label><select id="sm-side" class="form-input">
          <option value="sell">卖出</option><option value="buy">买入</option>
        </select></div>
        <div class="form-group"><label>数量</label><input id="sm-amount" type="number" class="form-input" value="0.1" step="0.001"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>追踪止盈激活价</label><input id="sm-tp-activation" type="number" class="form-input" value="50000"></div>
        <div class="form-group"><label>回调比例 %</label><input id="sm-tp-callback" type="number" class="form-input" value="2"></div>
        <button class="btn btn-primary" style="align-self:end" onclick="createTrailingTP()">追踪止盈</button>
      </div>
      <div class="form-row">
        <div class="form-group"><label>止盈价</label><input id="sm-oco-tp" type="number" class="form-input" value="55000"></div>
        <div class="form-group"><label>止损价</label><input id="sm-oco-sl" type="number" class="form-input" value="45000"></div>
        <button class="btn btn-warning" style="align-self:end" onclick="createOCO()">OCO 单</button>
      </div>
      <div class="form-row">
        <div class="form-group"><label>触发价</label><input id="sm-sl-stop" type="number" class="form-input" value="49000"></div>
        <div class="form-group"><label>限价</label><input id="sm-sl-limit" type="number" class="form-input" value="48500"></div>
        <button class="btn btn-ghost" style="align-self:end" onclick="createStopLimit()">止损限价</button>
      </div>
    </div>
    <div class="card"><h2>订单列表</h2><div id="smart-list"></div></div>
  </section>

  <!-- ========== 信号机器人 ========== -->
  <section id="tab-signal" class="tab-content">
    <div class="card">
      <h2>信号规则 <span class="badge badge-crypto">TradingView</span></h2>
      <div class="form-row">
        <div class="form-group"><label>名称</label><input id="sig-name" class="form-input" value="TV-BTC"></div>
        <div class="form-group"><label>交易对</label><input id="sig-symbol" class="form-input" value="BTC/USDT"></div>
        <div class="form-group"><label>动作</label><select id="sig-action" class="form-input">
          <option value="buy">买入</option><option value="sell">卖出</option><option value="close">平仓</option>
        </select></div>
        <div class="form-group"><label>资金比例 %</label><input id="sig-pct" type="number" class="form-input" value="30"></div>
        <button class="btn btn-primary" style="align-self:end" onclick="addSignalRule()">添加规则</button>
      </div>
    </div>
    <div class="grid-2">
      <div class="card"><h2>规则列表</h2><div id="signal-rules"></div></div>
      <div class="card"><h2>信号记录</h2><div id="signal-records"></div></div>
    </div>
    <div class="card"><h2>信号统计</h2><div id="signal-stats"></div></div>
  </section>

  <!-- ========== 跟单交易 ========== -->
  <section id="tab-copy" class="tab-content">
    <div class="card">
      <h2>交易员排行 <span class="badge badge-crypto">社交交易</span></h2>
      <div id="copy-traders"></div>
    </div>
    <div class="card"><h2>我的跟单</h2><div id="copy-subs"></div></div>
  </section>

  <!-- ========== 因子选股 ========== -->
  <section id="tab-factor" class="tab-content">
    <div class="card">
      <h2>A股因子选股 <span class="badge badge-astock">A股</span></h2>
      <div class="form-row">
        <div class="form-group"><label>选股数量</label><input id="fac-topn" type="number" class="form-input" value="20"></div>
        <button class="btn btn-primary" style="align-self:end" onclick="loadAshareData()">获取A股数据</button>
        <button class="btn btn-ghost" style="align-self:end" onclick="loadFactorCategories()">因子分类</button>
      </div>
    </div>
    <div class="grid-2">
      <div class="card"><h2>因子列表</h2><div id="factor-list" style="max-height:400px;overflow:auto"></div></div>
      <div class="card"><h2>A股实时行情</h2><div id="astock-list" style="max-height:400px;overflow:auto"></div></div>
    </div>
  </section>

  <!-- ========== 投资组合 ========== -->
  <section id="tab-portfolio" class="tab-content">
    <div class="card">
      <h2>投资组合 <span class="badge badge-institution">机构级</span></h2>
      <div class="stat-grid" id="portfolio-stats"></div>
    </div>
    <div class="grid-2">
      <div class="card"><h2>持仓</h2><div id="portfolio-positions"></div></div>
      <div class="card"><h2>风险平价权重</h2><div id="portfolio-weights"></div></div>
    </div>
    <div class="card"><h2>有效前沿</h2><div id="chart-frontier" style="height:350px"></div></div>
  </section>

  <!-- ========== 策略 ========== -->
  <section id="tab-strategy" class="tab-content">
    <div class="card"><h2>可用策略</h2><div id="strategy-list"></div></div>
  </section>

  <!-- ========== 设置 ========== -->
  <section id="tab-settings" class="tab-content">
    <div class="card">
      <h2>API Key 管理</h2>
      <div class="form-row">
        <div class="form-group"><label>交易所</label><input id="key-exchange" class="form-input" value="binance"></div>
        <div class="form-group"><label>API Key</label><input id="key-api" class="form-input"></div>
        <div class="form-group"><label>Secret</label><input id="key-secret" type="password" class="form-input"></div>
        <div class="form-group"><label>Passphrase</label><input id="key-pass" class="form-input" placeholder="可选"></div>
        <div style="align-self:end"><button class="btn btn-primary" onclick="setApiKey()">保存</button></div>
      </div>
      <div id="key-list" style="margin-top:16px"></div>
    </div>
    <div class="card">
      <h2>KMS 加密</h2>
      <div id="kms-info"></div>
    </div>
  </section>

</main>

<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
let strategies=[];

// Tab
document.querySelectorAll(".nav-tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".nav-tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("tab-"+t.dataset.tab).classList.add("active");
  // 懒加载
  const tab=t.dataset.tab;
  if(tab==="grid")loadGrids();
  if(tab==="dca")loadDCAs();
  if(tab==="smart")loadSmartOrders();
  if(tab==="signal")loadSignals();
  if(tab==="copy")loadCopyTrading();
  if(tab==="factor")loadFactors();
  if(tab==="portfolio")loadPortfolio();
});

// Toast
function toast(msg,type="info"){const c=document.getElementById("toast-container");const e=document.createElement("div");e.className="toast "+type;e.textContent=msg;c.appendChild(e);setTimeout(()=>{e.style.opacity="0";setTimeout(()=>e.remove(),300)},3000)}

// API
async function api(url,opts={}){try{const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});return await r.json()}catch(e){toast("请求失败: "+e.message,"error");throw e}}

// Init
async function init(){
  const d=await api("/api/strategies");strategies=d.strategies||[];
  const sel=document.getElementById("bt-strategy");
  sel.innerHTML=strategies.map(s=>`<option value="${s.name}">${s.name} — ${s.description}</option>`).join("");
  loadUsers();loadKeys();loadKMS();
}
init();

// ==================== 回测 ====================
async function doBacktest(){
  const d=await api("/api/backtest",{method:"POST",body:JSON.stringify({
    strategy:document.getElementById("bt-strategy").value,
    symbol:document.getElementById("bt-symbol").value,
    timeframe:document.getElementById("bt-timeframe").value,
    days:+document.getElementById("bt-days").value,
    mock:document.getElementById("bt-mock").value==="true"
  })});
  if(d.success)showBacktestResult(d.result);else toast(d.error||"回测失败","error");
}

function showBacktestResult(r){
  document.getElementById("bt-result").style.display="block";
  const cls=r.profit_pct>=0?"positive":"negative";
  document.getElementById("bt-stats").innerHTML=`
    <div class="stat-card ${cls}"><div class="value">${r.profit_pct>=0?"+":""}${r.profit_pct?.toFixed(2)}%</div><div class="label">总收益</div></div>
    <div class="stat-card"><div class="value">${r.total_trades}</div><div class="label">交易次数</div></div>
    <div class="stat-card"><div class="value">${r.win_rate?.toFixed(1)}%</div><div class="label">胜率</div></div>
    <div class="stat-card"><div class="value">${r.sharpe_ratio?.toFixed(2)}</div><div class="label">夏普比率</div></div>
    <div class="stat-card negative"><div class="value">${r.max_drawdown_pct?.toFixed(2)}%</div><div class="label">最大回撤</div></div>

  document.getElementById("portfolio-positions").innerHTML=pos.length?`<table><tr><th>交易对</th><th>数量</th><th>均价</th><th>现价</th><th>PnL</th><th>权重</th></tr>${

  }</table>`:'<div class="empty-state">暂无持仓</div>';

  }</div>`:'<div class="empty-state">需设置持仓</div>';
  // 有效前沿
  try{
    const ef=await api("/api/portfolio/efficient-frontier?n_points=15");
    const frontier=ef.frontier||[];
    if(frontier.length>2){
      const ch=echarts.init(document.getElementById("chart-frontier"));
      ch.setOption({backgroundColor:"transparent",tooltip:{trigger:"item"},xAxis:{name:"波动率",type:"value",axisLine:{lineStyle:{color:"#2a2d3a"}},splitLine:{lineStyle:{color:"#1e2130"}}},yAxis:{name:"收益",type:"value",axisLine:{lineStyle:{color:"#2a2d3a"}},splitLine:{lineStyle:{color:"#1e2130"}}},series:[{
        type:"scatter",data:frontier.map(p=>[p.expected_volatility,p.expected_return]),

        tooltip:{formatter:p=>`波动率: ${(p.data[0]*100).toFixed(1)}%<br>收益: ${(p.data[1]*100).toFixed(1)}%`}
      }]});
    }
  }catch(e){}

async function setApiKey(){const d=await api("/api/keys",{method:"POST",body:JSON.stringify({exchange:document.getElementById("key-exchange").value,api_key:document.getElementById("key-api").value,api_secret:document.getElementById("key-secret").value,passphrase:document.getElementById("key-pass").value})});if(d.success){toast("Key 已保存","success");loadKeys()}else toast(d.detail||"保存失败","error")}
async function removeKey(e){await api("/api/keys/"+e,{method:"DELETE"});toast("已删除","success");loadKeys()}

async function loadKMS(){
  try{
    const d=await api("/api/kms/mode");
    document.getElementById("kms-info").innerHTML=`<div class="stat-grid">
      <div class="stat-card"><div class="value">${d.mode||"local"}</div><div class="label">加密模式</div></div>
    </div>`;
  }catch(e){}
}
</script>
</body>
</html>
